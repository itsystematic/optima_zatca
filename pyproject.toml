[project]
name = "optima_zatca"
authors = [
    { name = "IT Systematic", email = "sales@itsystematic.com"}
]
description = "App For Zatca Phase Two"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "cryptography>=44.0.1",
    "asn1==2.7.1",
    "qrcode==8.0",
    "pikepdf>=8.0.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Frappe / ERPNext versions this branch supports; bench checks them when it installs the app
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0-dev"
erpnext = ">=16.0.0-dev,<17.0.0-dev"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
