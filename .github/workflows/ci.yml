name: CI

on:
  push:
    branches: [develop, version-16]
  pull_request:
    branches: [develop, version-16]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout optima_zatca
        uses: actions/checkout@v5
        with:
          path: optima_zatca

      # Importing any ERPNext test module runs its BootStrapTestData, whose _Test Item
      # has no taxes and is refused by this app's mandatory Item taxes rule. Tests build
      # their records with optima_zatca's own factories instead.
      - name: Refuse imports of ERPNext test modules
        working-directory: optima_zatca
        run: |
          if grep -rnE "erpnext[.a-z_]*\.(tests|test_[a-z_]+)" --include=*.py optima_zatca/; then
            echo "::error::A test imports an ERPNext test module; use optima_zatca's factories instead."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Node 24 / Python 3.14 / MariaDB 11.8 are what frappe version-16 itself
      # builds on (see frappe's _base-server-tests.yml defaults) — its
      # engines.node is ">=24" and requires-python is ">=3.14,<3.15".
      # Node also has to clear the onboarding SPA: the root package.json
      # postinstall chains into zatca-onboarding, and `bench get-app` runs it
      # unconditionally, so too low a Node fails the install before any test.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # wkhtmltopdf + mariadb client are needed by bench/frappe at setup time.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mariadb-client libmariadb-dev wkhtmltopdf
          npm install -g yarn

      - name: Install frappe-bench
        run: pip install frappe-bench

      # required_apps = ["erpnext"], so erpnext must be pulled alongside the app.
      - name: Initialize bench with frappe + erpnext
        run: |
          bench init --skip-redis-config-generation --frappe-branch version-16 frappe-bench
          cd frappe-bench
          bench get-app --branch version-16 erpnext
          bench get-app optima_zatca "${GITHUB_WORKSPACE}/optima_zatca"

      # These modules promise to run without a site, the way CLAUDE.md tells developers
      # to run them; this keeps that promise honest. The app run below runs them again.
      - name: Run site-free tests
        working-directory: frappe-bench/apps/optima_zatca
        run: |
          ../../env/bin/python -m unittest \
            optima_zatca.zatca.tests.test_xml_transport \
            optima_zatca.zatca.tests.test_invoice_data \
            optima_zatca.zatca.tests.test_prepayment_invoice \
            optima_zatca.zatca.tests.test_onboarding_retry \
            optima_zatca.zatca.tests.test_register_company

      - name: Create test site and install apps
        working-directory: frappe-bench
        run: |
          bench set-config -g root_password root
          # bench init ran with --skip-redis-config-generation, so Frappe still
          # points at the default redis://127.0.0.1:11000 (nothing listens there).
          # Point cache/queue/socketio at the CI redis service on 6379, or the
          # after_install hooks that enqueue jobs fail with "Connection refused".
          bench set-config -g redis_cache "redis://127.0.0.1:6379"
          bench set-config -g redis_queue "redis://127.0.0.1:6379"
          bench set-config -g redis_socketio "redis://127.0.0.1:6379"
          bench new-site test_site \
            --db-root-password root \
            --admin-password admin \
            --mariadb-user-host-login-scope='%'
          bench --site test_site install-app erpnext optima_zatca
          bench --site test_site set-config allow_tests true

      # Discovers every test_*.py in the app, so a new test file needs no step here.
      - name: Run optima_zatca tests
        working-directory: frappe-bench
        run: bench --site test_site run-tests --app optima_zatca
